<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>方塘 Mindfeed · 知识卡片</title>
<meta name="description" content="方塘 Mindfeed — 把知识裁成一张张随时可以翻开的卡片。">
<meta name="author" content="方塘 Mindfeed">
<meta name="copyright" content="© 2026 方塘 Mindfeed. 保留所有权利。">
<script>
  (function () {
    try {
      var t = localStorage.getItem('ft-theme') || 'light';
      document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  })();
</script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root,
  [data-theme="light"] {
    --bg:          #F5F2EC;
    --bg-soft:     #EDE8DF;
    --card:        #FFFFFF;
    --ink:         #1A1A18;
    --ink-2:       #6E6A62;
    --ink-3:       #A8A298;
    --line:        #E7E1D7;
    --accent:      #1F5C4A;
    --accent-soft: rgba(31, 92, 74, .08);
    --glow:        rgba(31, 92, 74, .07);
    --shadow-card:
      0 1px 2px rgba(26,26,24,.05),
      0 4px 10px -3px rgba(26,26,24,.07),
      0 14px 30px -10px rgba(26,26,24,.13);
    --shadow-card-hover:
      0 2px 5px rgba(26,26,24,.06),
      0 12px 26px -8px rgba(26,26,24,.15),
      0 34px 64px -20px rgba(26,26,24,.28);
    --card-inset: inset 0 1px 0 rgba(255,255,255,.95), inset 0 -1px 0 rgba(26,26,24,.03);
    --card-sheen: linear-gradient(180deg, rgba(255,255,255,.9), rgba(255,255,255,0) 40%);
    --shadow-sm:  0 2px 8px rgba(26,26,24,.07);
    --modal-bd:   rgba(255,255,255,0);
    --modal-shadow: 0 40px 90px -24px rgba(26,26,24,.45);
  }
  [data-theme="dark"] {
    --bg:#0F1218; --bg-soft:#161A21; --card:#1A1F27;
    --ink:#ECE9E3; --ink-2:#9C9890; --ink-3:#67635D;
    --line:#272C35; --accent:#6FC8A8; --accent-soft:rgba(111,200,168,.10);
    --glow:rgba(111,200,168,.07);
    --shadow-card:0 1px 2px rgba(0,0,0,.45),0 6px 14px -4px rgba(0,0,0,.5),0 18px 38px -14px rgba(0,0,0,.65);
    --shadow-card-hover:0 2px 6px rgba(0,0,0,.5),0 16px 34px -10px rgba(0,0,0,.65),0 42px 80px -24px rgba(0,0,0,.85);
    --card-inset: inset 0 1px 0 rgba(255,255,255,.07);
    --card-sheen: linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,0) 42%);
    --shadow-sm: 0 2px 8px rgba(0,0,0,.4);
    --modal-bd:  rgba(255,255,255,.07);
    --modal-shadow: 0 40px 90px -24px rgba(0,0,0,.9);
  }
  [data-theme="eye"] {
    --bg:#D8E9D1; --bg-soft:#CFE2C7; --card:#F3FAEF;
    --ink:#22301E; --ink-2:#586A50; --ink-3:#8DA183;
    --line:#BED3B5; --accent:#2E6B3C; --accent-soft:rgba(46,107,60,.09);
    --glow:rgba(46,107,60,.09);
    --shadow-card:0 1px 2px rgba(34,48,30,.06),0 4px 10px -3px rgba(34,48,30,.09),0 14px 30px -10px rgba(34,48,30,.16);
    --shadow-card-hover:0 2px 5px rgba(34,48,30,.07),0 12px 26px -8px rgba(34,48,30,.18),0 34px 64px -20px rgba(34,48,30,.3);
    --card-inset: inset 0 1px 0 rgba(255,255,255,.85);
    --card-sheen: linear-gradient(180deg, rgba(255,255,255,.7), rgba(255,255,255,0) 40%);
    --shadow-sm: 0 2px 8px rgba(34,48,30,.09);
    --modal-bd:  rgba(255,255,255,.5);
    --modal-shadow: 0 40px 90px -24px rgba(34,48,30,.4);
  }

  [data-cat="增长"]     { --cat: #B5541F; }
  [data-cat="商业模式"] { --cat: #1F5C4A; }
  [data-cat="用户运营"] { --cat: #2E5C8A; }
  [data-cat="战略"]     { --cat: #6B4A9E; }
  [data-cat="数据"]     { --cat: #1F7A7A; }
  [data-cat="转化"]     { --cat: #A63E5E; }

  html { scroll-behavior: smooth; }
  body {
    background: var(--bg);
    background-image: radial-gradient(circle at 15% -5%, var(--glow), transparent 55%);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    transition: background-color .35s ease, color .35s ease;
  }
  .nav, .card, .modal-panel, .pill, .tag, .theme-switch,
  .theme-switch button, .section-tab, .search input,
  .modal-nav button, .modal-top-btn, .s-count, .s-badge {
    transition: background-color .35s ease, color .35s ease,
                border-color .35s ease, box-shadow .35s ease,
                transform .3s cubic-bezier(.2,.8,.2,1);
  }

  /* ============ 顶部导航 ============ */
  .nav {
    position: sticky; top: 0; z-index: 50;
    background: color-mix(in srgb, var(--bg) 82%, transparent);
    backdrop-filter: saturate(180%) blur(14px);
    -webkit-backdrop-filter: saturate(180%) blur(14px);
    border-bottom: 1px solid var(--line);
  }
  .nav-inner {
    max-width: 1180px; margin: 0 auto;
    padding: 13px 24px;
    display: flex; align-items: center; gap: 24px;
  }
  .logo {
    display: flex; align-items: center; gap: 10px;
    font-weight: 700; font-size: 15px;
    color: var(--ink); text-decoration: none;
    flex-shrink: 0;
  }
  .logo-mark {
    width: 30px; height: 30px; border-radius: 9px;
    background: var(--accent); color: var(--bg);
    display: grid; place-items: center;
    font-size: 15px; font-weight: 700;
    box-shadow: var(--shadow-sm);
  }
  .logo-text em { font-style: normal; font-weight: 500; color: var(--ink-3); font-size: 13px; margin-left: 2px; }
  .nav-links { display: flex; gap: 26px; font-size: 14px; }
  .nav-links a { color: var(--ink-2); text-decoration: none; }
  .nav-links a:hover { color: var(--ink); }
  .theme-switch {
    margin-left: auto; display: flex; gap: 2px;
    padding: 3px; border-radius: 11px;
    background: var(--bg-soft); border: 1px solid var(--line);
    flex-shrink: 0;
  }
  .theme-switch button {
    width: 33px; height: 27px;
    border: 0; background: transparent; border-radius: 8px;
    color: var(--ink-3); cursor: pointer;
    display: grid; place-items: center; padding: 0;
  }
  .theme-switch button:hover { color: var(--ink); }
  .theme-switch button.active { background: var(--card); color: var(--accent); box-shadow: var(--shadow-sm); }
  .theme-switch svg { width: 15px; height: 15px; }

  /* ============ Hero ============ */
  .hero {
    max-width: 1180px; margin: 0 auto;
    padding: 64px 24px 40px;
    display: grid;
    grid-template-columns: minmax(0, 1fr) 300px;
    gap: 56px;
    align-items: center;
  }
  .hero-text { min-width: 0; }

  .hero-eyebrow {
    display: inline-flex; align-items: center; gap: 8px;
    font-size: 11px; font-weight: 800; letter-spacing: .16em;
    text-transform: uppercase;
    color: var(--accent); background: var(--accent-soft);
    padding: 6px 13px; border-radius: 999px; margin-bottom: 22px;
  }
  .hero-eyebrow::before {
    content: ''; width: 5px; height: 5px; border-radius: 50%;
    background: currentColor;
  }
  .hero h1 {
    font-size: clamp(17px, 4.5vw, 36px);
    line-height: 1.18;
    letter-spacing: -.028em;
    font-weight: 800;
    white-space: nowrap;
    color: var(--ink);
  }
  .hero h1 em { font-style: normal; color: var(--accent); }
  .hero p {
    margin-top: 18px; font-size: 15.5px;
    color: var(--ink-2); line-height: 1.78;
    max-width: 46ch;
  }

  .search { margin-top: 28px; max-width: 380px; position: relative; }
  .search input {
    width: 100%; padding: 13px 16px 13px 46px;
    border-radius: 14px; border: 1px solid var(--line);
    background: var(--card); font-size: 15px;
    font-family: inherit; color: var(--ink); outline: none;
    box-shadow: var(--shadow-sm), var(--card-inset);
    transition: border-color .2s, box-shadow .2s, background-color .35s;
  }
  .search input::placeholder { color: var(--ink-3); }
  .search input:focus { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft), var(--shadow-sm); }
  .search svg { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--ink-3); pointer-events: none; }

  /* 右侧层叠卡片装饰 */
  .hero-visual {
    position: relative;
    height: 230px;
    pointer-events: none;
  }
  .hero-visual .deco {
    position: absolute;
    border-radius: 18px;
    background: var(--card);
    background-image: var(--card-sheen);
    border: 1px solid var(--line);
    box-shadow: var(--shadow-card), var(--card-inset);
  }
  .hero-visual .deco-back {
    width: 190px; height: 135px;
    top: 50px; left: 0;
    transform: rotate(-8deg);
    opacity: .55;
  }
  .hero-visual .deco-mid {
    width: 210px; height: 155px;
    top: 28px; left: 36px;
    transform: rotate(4deg);
    opacity: .8;
  }
  .hero-visual .deco-front {
    width: 235px; height: 175px;
    top: 4px; left: 74px;
    transform: rotate(-2deg);
    padding: 18px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .hero-visual .deco-front::before {
    content: '';
    width: 30px; height: 30px;
    border-radius: 9px;
    background: var(--accent);
    display: block;
  }
  .hero-visual .deco-front::after {
    content: '';
    display: block;
    height: 7px;
    width: 65%;
    border-radius: 4px;
    background: var(--line);
    box-shadow: 0 15px 0 var(--line), 0 30px 0 var(--line);
  }

  /* ============ 板块 Tab ============ */
  .sections {
    max-width: 1180px; margin: 0 auto 22px;
    padding: 0 24px 18px;
    display: flex; gap: 6px; flex-wrap: wrap;
    border-bottom: 1px solid var(--line);
  }
  .section-tab {
    position: relative;
    display: inline-flex; align-items: center; gap: 8px;
    padding: 10px 16px 14px;
    border: 0; background: transparent;
    font-family: inherit; font-size: 15px; font-weight: 600;
    color: var(--ink-3); cursor: pointer; letter-spacing: -.01em;
  }
  .section-tab:hover { color: var(--ink-2); }
  .section-tab.active { color: var(--ink); }
  .section-tab.active::after {
    content: ''; position: absolute; left: 12px; right: 12px; bottom: -1px;
    height: 2px; border-radius: 2px; background: var(--accent);
  }
  .s-count {
    font-size: 11.5px; font-weight: 700;
    padding: 1px 7px; border-radius: 999px;
    background: var(--bg-soft); color: var(--ink-3);
    font-variant-numeric: tabular-nums;
  }
  .section-tab.active .s-count { background: var(--accent-soft); color: var(--accent); }
  .s-badge {
    font-size: 10.5px; font-weight: 700; letter-spacing: .04em;
    padding: 1px 7px; border-radius: 999px;
    background: var(--bg-soft); color: var(--ink-3);
  }

  /* ============ 分类筛选 ============ */
  .filters {
    max-width: 1180px; margin: 0 auto;
    padding: 0 24px 26px;
    display: flex; gap: 8px; flex-wrap: wrap;
  }
  .filters:empty { display: none; }
  .pill {
    padding: 8px 16px; border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--card);
    font-family: inherit; font-size: 13.5px;
    color: var(--ink-2); cursor: pointer; white-space: nowrap;
    box-shadow: var(--shadow-sm);
  }
  .pill:hover { border-color: var(--ink-3); color: var(--ink); }
  .pill.active { background: var(--ink); border-color: var(--ink); color: var(--bg); }

  /* ============ 卡片网格 ============ */
  .grid {
    max-width: 1180px; margin: 0 auto;
    padding: 0 24px 90px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(min(290px, 100%), 1fr));
    gap: 20px;
  }
  .card-wrap { animation: cardIn .55s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes cardIn {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: none; }
  }
  .card {
    position: relative; height: 100%; min-height: 258px;
    background: var(--card); background-image: var(--card-sheen);
    border: 1px solid var(--line); border-radius: 20px;
    padding: 22px; display: flex; flex-direction: column;
    cursor: pointer; overflow: hidden;
    user-select: none; -webkit-user-select: none;
    box-shadow: var(--shadow-card), var(--card-inset);
    transition: transform .32s cubic-bezier(.2,.8,.2,1),
                box-shadow .32s cubic-bezier(.2,.8,.2,1),
                border-color .3s ease, background-color .35s ease;
    will-change: transform;
  }
  .card:hover {
    transform: translateY(-6px);
    box-shadow: var(--shadow-card-hover), var(--card-inset);
    border-color: color-mix(in srgb, var(--accent) 34%, var(--line));
  }
  .card:active { transform: translateY(-2px); }
  .card::after {
    content: ''; position: absolute; left: 0; top: 20%; bottom: 20%;
    width: 3px; border-radius: 0 3px 3px 0;
    background: var(--cat, var(--accent));
    opacity: 0; transform: scaleY(.35);
    transition: opacity .3s ease, transform .35s cubic-bezier(.2,.8,.2,1);
  }
  .card:hover::after { opacity: 1; transform: scaleY(1); }
  .card-no {
    position: absolute; top: 12px; right: 18px;
    font-size: 46px; font-weight: 800; line-height: 1;
    letter-spacing: -.05em; color: var(--ink); opacity: .045;
    font-variant-numeric: tabular-nums; pointer-events: none;
    transition: opacity .3s ease, color .35s ease;
  }
  .card:hover .card-no { opacity: .1; color: var(--accent); }
  .tag {
    align-self: flex-start; display: inline-block;
    font-size: 11.5px; font-weight: 700; letter-spacing: .04em;
    padding: 4px 10px; border-radius: 7px; margin-bottom: 16px;
    color: var(--cat, var(--accent));
    background: color-mix(in srgb, var(--cat, var(--accent)) 13%, transparent);
  }
  .card h3 {
    font-size: 18.5px; font-weight: 700; line-height: 1.35;
    letter-spacing: -.015em; margin-bottom: 10px; padding-right: 28px;
  }
  .card .summary {
    flex: 1; font-size: 14px; line-height: 1.7; color: var(--ink-2);
    display: -webkit-box; -webkit-line-clamp: 3; line-clamp: 3;
    -webkit-box-orient: vertical; overflow: hidden;
  }
  .card-foot {
    margin-top: 18px; padding-top: 14px;
    border-top: 1px solid var(--line);
    display: flex; align-items: center; justify-content: space-between;
    font-size: 12.5px; color: var(--ink-3);
  }
  .card-foot .arrow { transition: transform .3s ease, color .3s ease; }
  .card:hover .card-foot .arrow { transform: translateX(4px); color: var(--accent); }

  .empty {
    max-width: 1180px; margin: 0 auto;
    padding: 56px 24px 130px; text-align: center; display: none;
  }
  .empty.show { display: block; }
  .empty-icon {
    width: 54px; height: 54px; margin: 0 auto 18px;
    border-radius: 16px; background: var(--card);
    border: 1px solid var(--line);
    box-shadow: var(--shadow-sm), var(--card-inset);
    display: grid; place-items: center; color: var(--ink-3);
  }
  .empty h4 { font-size: 17px; font-weight: 700; margin-bottom: 8px; }
  .empty p { font-size: 14px; color: var(--ink-3); }

  /* ============ 弹窗 ============ */
  .modal { position: fixed; inset: 0; z-index: 100; display: none; }
  .modal.open { display: block; }
  .modal-backdrop {
    position: absolute; inset: 0;
    background: rgba(10, 10, 10, .45);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    animation: fadeIn .25s ease both;
  }
  @keyframes fadeIn { from { opacity: 0 } to { opacity: 1 } }
  .modal-panel {
    position: relative;
    width: calc(100% - 32px); max-width: 720px; max-height: 90vh;
    margin: 5vh auto; background: var(--card);
    border: 1px solid var(--modal-bd); border-radius: 24px;
    overflow-y: auto; overscroll-behavior: contain;
    box-shadow: var(--modal-shadow), var(--card-inset);
    animation: panelIn .38s cubic-bezier(.2,.8,.2,1) both;
  }
  @keyframes panelIn {
    from { opacity: 0; transform: translateY(24px) scale(.97); }
    to   { opacity: 1; transform: none; }
  }
  .modal-bar { position: sticky; top: 0; height: 0; z-index: 3; }
  .modal-close {
    position: absolute; right: 16px; top: 16px;
    width: 36px; height: 36px; border-radius: 50%;
    border: 1px solid var(--line);
    background: color-mix(in srgb, var(--card) 88%, transparent);
    backdrop-filter: blur(8px);
    color: var(--ink-2); font-size: 20px; line-height: 1;
    display: grid; place-items: center; cursor: pointer;
    box-shadow: var(--shadow-sm);
  }
  .modal-close:hover { background: var(--ink); border-color: var(--ink); color: var(--bg); }
  .modal-body { padding: 42px 38px 34px; }

  .m-head { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
  .m-head .tag { margin-bottom: 0; }
  .m-no {
    font-size: 12px; font-weight: 700; letter-spacing: .08em;
    color: var(--ink-3); font-variant-numeric: tabular-nums;
  }
  .m-title {
    font-size: clamp(23px, 3vw, 29px); font-weight: 800;
    line-height: 1.28; letter-spacing: -.028em; margin-bottom: 14px;
  }
  .m-sub { font-size: 15px; line-height: 1.75; color: var(--ink-2); }
  .m-quote {
    margin: 26px 0; padding: 16px 22px;
    border-left: 3px solid var(--accent);
    background: var(--accent-soft);
    border-radius: 0 12px 12px 0;
    font-size: 16px; font-weight: 500; line-height: 1.72;
    color: var(--accent);
  }
  .m-section-title {
    font-size: 11.5px; font-weight: 800; letter-spacing: .14em;
    text-transform: uppercase; color: var(--ink-3); margin-bottom: 16px;
  }
  .m-points { list-style: none; display: flex; flex-direction: column; gap: 15px; }
  .m-points li { display: flex; gap: 14px; align-items: flex-start; }
  .m-idx {
    flex-shrink: 0; width: 24px; height: 24px; margin-top: 2px;
    border-radius: 8px; background: var(--bg-soft); color: var(--ink-2);
    font-size: 12px; font-weight: 700; display: grid; place-items: center;
    font-variant-numeric: tabular-nums; box-shadow: var(--card-inset);
  }
  .m-points b { display: block; font-size: 14.5px; font-weight: 700; margin-bottom: 2px; }
  .m-points span { font-size: 13.5px; line-height: 1.65; color: var(--ink-2); }

  .modal-nav {
    margin-top: 32px; padding-top: 22px;
    border-top: 1px solid var(--line);
    display: flex; align-items: center; justify-content: center; gap: 12px;
  }
  .modal-nav button {
    width: 44px; height: 44px; border-radius: 50%;
    border: 1px solid var(--line);
    background: var(--card); background-image: var(--card-sheen);
    color: var(--ink-2); cursor: pointer;
    display: grid; place-items: center;
    box-shadow: var(--shadow-sm), var(--card-inset);
  }
  .modal-nav button:hover:not(:disabled) {
    background: var(--ink); border-color: var(--ink); color: var(--bg);
    transform: translateY(-2px);
    box-shadow: var(--shadow-card), var(--card-inset);
  }
  .modal-nav button:disabled { opacity: .32; cursor: not-allowed; }
  .modal-nav svg { width: 17px; height: 17px; }
  .modal-pos {
    min-width: 84px; text-align: center;
    font-size: 13px; font-weight: 700; color: var(--ink-2);
    font-variant-numeric: tabular-nums; letter-spacing: .08em;
  }

  /* ============ 弹窗回到顶部按钮 ============ */
  .modal-top-btn {
    position: fixed;
    right: 24px;
    bottom: 32px;
    width: 46px;
    height: 46px;
    border-radius: 50%;
    border: 1px solid var(--line);
    background: var(--card);
    background-image: var(--card-sheen);
    color: var(--ink-2);
    display: grid;
    place-items: center;
    cursor: pointer;
    box-shadow: var(--shadow-card), var(--card-inset);
    opacity: 0;
    transform: translateY(8px);
    pointer-events: none;
    z-index: 110;
    transition: opacity .25s ease, transform .25s ease,
                background-color .2s, color .2s, border-color .2s;
  }
  .modal-top-btn.show {
    opacity: 1;
    transform: translateY(0);
    pointer-events: auto;
  }
  .modal-top-btn:hover {
    color: var(--accent);
    border-color: var(--accent);
    transform: translateY(-2px);
  }

  /* ============ 页脚 ============ */
  footer {
    border-top: 1px solid var(--line);
    padding: 34px 24px 40px;
    user-select: none; -webkit-user-select: none;
  }
  .foot-inner {
    max-width: 1180px; margin: 0 auto;
    display: flex; flex-direction: column;
    align-items: center; gap: 12px; text-align: center;
  }
  .foot-brand { display: flex; align-items: center; gap: 9px; font-size: 14px; font-weight: 700; color: var(--ink-2); }
  .foot-brand .logo-mark { width: 24px; height: 24px; border-radius: 7px; font-size: 12px; }
  .foot-copy { font-size: 13px; color: var(--ink-3); letter-spacing: .01em; }

  /* ============ 响应式 ============ */
  @media (max-width: 900px) {
    .hero {
      grid-template-columns: 1fr;
      gap: 0;
      padding: 52px 20px 32px;
    }
    .hero-visual { display: none; }
    .hero p { max-width: none; }
  }

  @media (max-width: 720px) {
    .nav-links { display: none; }
    .sections { padding: 0 20px 14px; gap: 0; margin-bottom: 18px; }
    .section-tab { padding: 10px 12px 14px; font-size: 14px; }
    .filters { padding: 0 20px 22px; }
    .grid { padding: 0 20px 70px; gap: 14px; }
    .modal-body { padding: 36px 22px 26px; }
    .m-quote { font-size: 15px; padding: 14px 18px; }
    .card { min-height: 236px; }
    .modal-top-btn {
      right: 16px;
      bottom: 20px;
      width: 42px;
      height: 42px;
    }
    .hero h1 { white-space: nowrap; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: .01ms !important;
      transition-duration: .01ms !important;
    }
  }
</style>
</head>
<body>

<header class="nav">
  <div class="nav-inner">
    <a class="logo" href="#">
      <span class="logo-mark">方</span>
      <span class="logo-text">方塘 <em>Mindfeed</em></span>
    </a>
    <nav class="nav-links">
      <a href="#library">卡片库</a>
      <a href="#">专题合集</a>
      <a href="#">关于</a>
    </nav>
    <div class="theme-switch" role="group" aria-label="主题切换">
      <button data-theme-btn="light" title="白天模式" aria-label="白天模式">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
        </svg>
      </button>
      <button data-theme-btn="dark" title="夜晚模式" aria-label="夜晚模式">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/>
        </svg>
      </button>
      <button data-theme-btn="eye" title="护眼模式" aria-label="护眼模式">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/>
          <circle cx="12" cy="12" r="3"/>
        </svg>
      </button>
    </div>
  </div>
</header>

<main id="library">
  <!-- Hero -->
  <section class="hero">
    <div class="hero-text">
      <div class="hero-eyebrow">方塘 · Knowledge Cards</div>
      <h1>半亩方塘一鉴开，源头活水<em>自己罐</em></h1>
      <p>把复杂的知识，裁成一张张随时可以翻开的卡片。商业运营、四书五经、中国历史……一个板块，一种看世界的方式。</p>
      <div class="search">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
          <circle cx="11" cy="11" r="7"></circle>
          <path d="M20 20l-3.5-3.5"></path>
        </svg>
        <input id="searchInput" type="text" placeholder="搜索模型、方法或关键词…" autocomplete="off">
      </div>
    </div>

    <!-- 右侧层叠卡片装饰 -->
    <div class="hero-visual" aria-hidden="true">
      <div class="deco deco-back"></div>
      <div class="deco deco-mid"></div>
      <div class="deco deco-front"></div>
    </div>
  </section>

  <nav class="sections" id="sections"></nav>
  <div class="filters" id="filters"></div>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty">
    <div class="empty-icon">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 5h16v14H4z"/><path d="M8 9h8M8 13h5"/>
      </svg>
    </div>
    <h4 id="emptyTitle">暂无内容</h4>
    <p id="emptyDesc">换个关键词试试。</p>
  </div>
</main>

<footer>
  <div class="foot-inner">
    <div class="foot-brand">
      <span class="logo-mark">方</span>
      <span>方塘 Mindfeed</span>
    </div>
    <p class="foot-copy">© 2026 方塘 Mindfeed. 保留所有权利。</p>
  </div>
</footer>

<!-- 弹窗 -->
<div class="modal" id="modal">
  <div class="modal-backdrop" data-close></div>
  <div class="modal-panel" id="modalPanel">
    <div class="modal-bar">
      <button class="modal-close" data-close aria-label="关闭">×</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
  <button class="modal-top-btn" id="modalTopBtn" aria-label="回到顶部">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 19V5M5 12l7-7 7 7"/>
    </svg>
  </button>
</div>

<script>
/* =========================================================
   API 接入层（同域部署，留空即可）
   ========================================================= */
const API_BASE = '';

const API = {
  async get(path) {
    const res = await fetch(API_BASE + path, { headers: { Accept: 'application/json' } });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return res.json();
  }
};

/* =========================================================
   全局状态
   ========================================================= */
const state = { section: 'business', cat: '全部', q: '', list: [], index: -1 };
let SECTIONS = [];
let CARDS = [];
const cardCache = new Map();

/* =========================================================
   DOM
   ========================================================= */
const sectionsEl  = document.getElementById('sections');
const filtersEl   = document.getElementById('filters');
const grid        = document.getElementById('grid');
const emptyEl     = document.getElementById('empty');
const emptyTitle  = document.getElementById('emptyTitle');
const emptyDesc   = document.getElementById('emptyDesc');
const searchInput = document.getElementById('searchInput');
const modal       = document.getElementById('modal');
const modalPanel  = document.getElementById('modalPanel');
const modalBody   = document.getElementById('modalBody');
const modalTopBtn = document.getElementById('modalTopBtn');

/* =========================================================
   渲染：板块
   ========================================================= */
function renderSections() {
  sectionsEl.innerHTML = SECTIONS.map(s => {
    const active = s.slug === state.section ? ' active' : '';
    const badge = (s.status === 'live' && s.cardCount)
      ? `<span class="s-count">${s.cardCount}</span>`
      : `<span class="s-badge">筹备中</span>`;
    return `<button class="section-tab${active}" data-section="${s.slug}">
              <span>${s.name}</span>${badge}
            </button>`;
  }).join('');
}

/* =========================================================
   渲染：分类筛选
   ========================================================= */
function renderFilters() {
  const cats = ['全部', ...new Set(CARDS.map(c => c.category))];
  if (!CARDS.length) { filtersEl.innerHTML = ''; return; }
  if (!cats.includes(state.cat)) state.cat = '全部';
  filtersEl.innerHTML = cats.map(cat => {
    const active = cat === state.cat ? ' active' : '';
    return `<button class="pill${active}" data-cat="${cat}">${cat}</button>`;
  }).join('');
}

/* =========================================================
   渲染：卡片网格
   ========================================================= */
function render() {
  if (!CARDS.length) {
    const s = SECTIONS.find(x => x.slug === state.section);
    grid.innerHTML = '';
    grid.style.display = 'none';
    emptyTitle.textContent = `「${s ? s.name : ''}」内容筹备中`;
    emptyDesc.textContent = '这个板块的卡片正在整理中，敬请期待。';
    emptyEl.classList.add('show');
    state.list = [];
    return;
  }

  const q = state.q.trim().toLowerCase();
  const list = CARDS.filter(c => {
    const matchCat = state.cat === '全部' || c.category === state.cat;
    const hay = (c.title + c.summary + c.category + (c.points || []).map(p => p.t + p.d).join('')).toLowerCase();
    return matchCat && (!q || hay.includes(q));
  });

  state.list = list;

  grid.innerHTML = list.map((c, i) => `
    <div class="card-wrap" style="animation-delay:${Math.min(i * 55, 400)}ms">
      <article class="card" data-cat="${c.category}" data-idx="${i}">
        <span class="card-no">${String(c.no).padStart(2, '0')}</span>
        <span class="tag">${c.category}</span>
        <h3>${c.title}</h3>
        <p class="summary">${c.summary}</p>
        <div class="card-foot">
          <span>${c.readMin} min 阅读</span>
          <span class="arrow">→</span>
        </div>
      </article>
    </div>
  `).join('');

  const isEmpty = list.length === 0;
  grid.style.display = isEmpty ? 'none' : 'grid';
  emptyEl.classList.toggle('show', isEmpty);
  if (isEmpty) {
    emptyTitle.textContent = '没有找到匹配的卡片';
    emptyDesc.textContent = '换个关键词，或者切换一下分类试试。';
  }
}

/* =========================================================
   数据加载
   ========================================================= */
async function loadSections() {
  const data = await API.get('/api/sections');
  SECTIONS = data.sections || [];
  const live = SECTIONS.find(s => s.status === 'live') || SECTIONS[0];
  if (live) state.section = live.slug;
}

async function loadCards(slug) {
  if (cardCache.has(slug)) return cardCache.get(slug);
  const data = await API.get('/api/sections/' + encodeURIComponent(slug));
  const cards = (data.cards || []).map(c => ({
    id: c.id,
    no: c.no,
    category: c.category || '未分类',
    readMin: c.readMin ?? 3,
    title: c.title,
    summary: c.summary || '',
    quote: c.quote || '',
    points: c.points || []
  }));
  cardCache.set(slug, cards);
  return cards;
}

/* =========================================================
   交互：板块切换
   ========================================================= */
sectionsEl.addEventListener('click', async e => {
  const btn = e.target.closest('.section-tab');
  if (!btn) return;
  const slug = btn.dataset.section;
  if (slug === state.section) return;

  state.section = slug;
  state.cat = '全部';
  state.q = '';
  searchInput.value = '';
  renderSections();

  try {
    CARDS = await loadCards(slug);
  } catch (err) {
    CARDS = [];
    console.warn('[方塘] 加载失败', err);
  }
  renderFilters();
  render();
});

/* =========================================================
   交互：分类 / 搜索
   ========================================================= */
filtersEl.addEventListener('click', e => {
  const btn = e.target.closest('.pill');
  if (!btn) return;
  state.cat = btn.dataset.cat;
  renderFilters();
  render();
});

searchInput.addEventListener('input', e => {
  state.q = e.target.value;
  render();
});

/* =========================================================
   弹窗
   ========================================================= */
let lastFocused = null;

function openModal(index) {
  const card = state.list[index];
  if (!card) return;
  state.index = index;
  const total = state.list.length;

  modalBody.innerHTML = `
    <div class="m-head" data-cat="${card.category}">
      <span class="tag">${card.category}</span>
      <span class="m-no">NO.${String(card.no).padStart(2, '0')} · ${card.readMin} min</span>
    </div>
    <h2 class="m-title">${card.title}</h2>
    <p class="m-sub">${card.summary}</p>
    ${card.quote ? `<blockquote class="m-quote">${card.quote}</blockquote>` : ''}
    <div class="m-section-title">核心要点</div>
    <ul class="m-points">
      ${(card.points || []).map((p, i) => `
        <li>
          <span class="m-idx">${i + 1}</span>
          <div><b>${p.t}</b><span>${p.d}</span></div>
        </li>
      `).join('')}
    </ul>
    <div class="modal-nav">
      <button data-nav="prev" ${index === 0 ? 'disabled' : ''} aria-label="上一张">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 5l-7 7 7 7"/>
        </svg>
      </button>
      <span class="modal-pos">${String(index + 1).padStart(2, '0')} / ${String(total).padStart(2, '0')}</span>
      <button data-nav="next" ${index === total - 1 ? 'disabled' : ''} aria-label="下一张">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 5l7 7-7 7"/>
        </svg>
      </button>
    </div>
  `;

  if (!modal.classList.contains('open')) {
    lastFocused = document.activeElement;
    modal.classList.add('open');
    document.body.style.overflow = 'hidden';

    /* 关键：推入一条历史记录，用于捕获移动端滑动返回 */
    try {
      if (!history.state || !history.state.ftModal) {
        history.pushState({ ftModal: true }, '');
      }
    } catch (e) {}
  }

  modalPanel.scrollTop = 0;
  modalTopBtn.classList.remove('show');
  modal.querySelector('.modal-close').focus({ preventScroll: true });
}

function closeModal() {
  if (!modal.classList.contains('open')) return;
  modal.classList.remove('open');
  document.body.style.overflow = '';
  state.index = -1;
  modalTopBtn.classList.remove('show');
  if (lastFocused) lastFocused.focus();
}

/* 主动关闭：先回退历史，由 popstate 统一收尾 */
function requestClose() {
  if (history.state && history.state.ftModal) {
    history.back();
  } else {
    closeModal();
  }
}

function goPrev() { if (state.index > 0) openModal(state.index - 1); }
function goNext() { if (state.index < state.list.length - 1) openModal(state.index + 1); }

grid.addEventListener('click', e => {
  const card = e.target.closest('.card');
  if (!card) return;
  openModal(Number(card.dataset.idx));
});

modal.addEventListener('click', e => {
  if (e.target.closest('[data-close]')) { requestClose(); return; }
  const nav = e.target.closest('[data-nav]');
  if (nav) {
    if (nav.dataset.nav === 'prev') goPrev();
    else goNext();
  }
});

document.addEventListener('keydown', e => {
  if (!modal.classList.contains('open')) return;
  if (e.key === 'Escape') { e.preventDefault(); requestClose(); return; }
  if (e.key === 'ArrowLeft')  { e.preventDefault(); goPrev(); }
  if (e.key === 'ArrowRight') { e.preventDefault(); goNext(); }
});

/* 移动端滑动返回 / 浏览器后退键：只关闭弹窗 */
window.addEventListener('popstate', () => {
  if (modal.classList.contains('open')) {
    closeModal();
  }
});

/* 弹窗内滚动超过 200px 显示回到顶部 */
modalPanel.addEventListener('scroll', () => {
  modalTopBtn.classList.toggle('show', modalPanel.scrollTop > 200);
});

modalTopBtn.addEventListener('click', () => {
  modalPanel.scrollTo({ top: 0, behavior: 'smooth' });
});

/* =========================================================
   主题切换
   ========================================================= */
const themeBtns = document.querySelectorAll('[data-theme-btn]');
const THEMES = ['light', 'dark', 'eye'];

function setTheme(t) {
  if (!THEMES.includes(t)) t = 'light';
  document.documentElement.setAttribute('data-theme', t);
  try { localStorage.setItem('ft-theme', t); } catch (e) {}
  themeBtns.forEach(b => b.classList.toggle('active', b.dataset.themeBtn === t));
}
themeBtns.forEach(b => {
  b.addEventListener('click', () => setTheme(b.dataset.themeBtn));
});
setTheme(document.documentElement.getAttribute('data-theme') || 'light');

/* =========================================================
   轻量内容保护
   ========================================================= */
document.addEventListener('contextmenu', e => {
  if (e.target.closest('input, textarea, .modal-body')) return;
  if (e.target.closest('.card, footer, .hero')) e.preventDefault();
});
document.addEventListener('dragstart', e => {
  if (e.target.closest('.card, footer')) e.preventDefault();
});

console.log('%c© 2026 方塘 Mindfeed. 保留所有权利。',
  'color:#1F5C4A;font-size:18px;font-weight:bold;');
console.log('%c本页面及其源代码受版权保护，未经授权严禁复制、镜像或用于商业用途。',
  'color:#B5541F;font-size:13px;font-weight:bold;');

/* =========================================================
   启动
   ========================================================= */
(async function boot() {
  try {
    await loadSections();
    CARDS = await loadCards(state.section);
  } catch (err) {
    console.warn('[方塘] 数据加载失败：', err);
    CARDS = [];
  }
  renderSections();
  renderFilters();
  render();
})();
</script>
</body>
</html>
